name: Check

# Root Markdown and docs/ change nothing the jobs check. Packaged skill docs
# under skills/ still start a run. The Release workflow calls this one for a tag.
on:
  push:
    branches: ['**']
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    paths-ignore: ['*.md', 'docs/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Node's test runner gives each shard whole files, so new files join a shard
  # without changes here.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Playground keeps each downloaded WordPress release here. The key changes
      # with the test files, since they decide which releases a shard needs.
      - uses: actions/cache@v6
        with:
          path: ~/.wordpress-playground
          key: playground-${{ matrix.shard }}-${{ hashFiles('tools/integration-fixture.mjs', 'tools/playground.mjs', 'tests/integration/*.test.mjs') }}
          restore-keys: playground-${{ matrix.shard }}-
      - run: node --test --test-shard=${{ matrix.shard }}/5 tests/integration/*.test.mjs

  editing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: npm install --global agent-browser@0.41.2
      - run: agent-browser install --with-deps
      - uses: actions/cache@v6
        with:
          path: ~/.wordpress-playground
          key: playground-editing-${{ hashFiles('tools/playground.mjs', 'tests/fixtures/**', 'tests/editing/**') }}
          restore-keys: playground-editing-
      - run: >-
          BLOCKWORK_TEST_HERE=1 pnpm test:editing tests/editing/common-edits.test.mjs
          --test-name-pattern='^(change the heading and button together|a guessed edit field is refused with a useful correction)$'
